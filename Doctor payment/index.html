    <!-- Dynamic PWA Manifest & Offline App Setup -->
    <script>
        (function() {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0284c7"/><path d="M256 120v272M120 256h272" stroke="#ffffff" stroke-width="58" stroke-linecap="round"/><circle cx="385" cy="385" r="78" fill="#10b981"/><path d="M352 385l24 24 44-46" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.href = iconUrl;
            document.head.appendChild(linkIcon);

            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.href = iconUrl;
            document.head.appendChild(appleIcon);

            const manifest = {
                name: "Doctor Payment Reconciliation System",
                short_name: "DocReconcile",
                start_url: ".",
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#0284c7",
                orientation: "any",
                icons: [
                    { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
                    { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(manifestLink);

            if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                const swCode = `
                    const CACHE_NAME = 'doc-reconcile-app-v1';
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
                                const resClone = res.clone();
                                caches.open(CACHE_NAME).then(cache => cache.put(e.request, resClone));
                                return res;
                            }).catch(() => cached))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
            }
        })();
    </script>

            // Initialize Firebase Authentication & Real-time Cloud Firestore Sync

                const pettyAuditEntries = (Array.isArray(pettyVouchers) ? pettyVouchers : []).map(v => ({

                    cbCashExpected: 0,
                    cbPhysical: 0,
                    cbVariance: 0,
                    timestamp: `${v.date} ${v.time}`

                const combinedLogs = [...logs, ...pettyAuditEntries];

                return combinedLogs.filter(log => {
                    const isCashierRecord = log.sourceTab === 'cashierSheet' || 
                        (log.sourceTab === undefined && (Number(log.cbPhysical || 0) !== 0 || Number(log.cbCashExpected || 0) !== 0 || Number(log.cbCardExpected || 0) !== 0) && Number(log.docPhysical || 0) === 0 && Number(log.docExpected || 0) === 0);

            // Older records may have only a localized `date` value, which Date.parse cannot

            const normalizePettyVoucherDate = (raw) => {
                if (raw === null || raw === undefined || raw === '') return '';
                const value = String(raw).trim();
                const isoMatch = value.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
                const localMatch = value.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
                if (localMatch) {
                    let first = Number(localMatch[1]);
                    let second = Number(localMatch[2]);
                    const year = Number(localMatch[3]);
                    // Sri Lankan dates are normally DD/MM/YYYY. If the first part cannot
                    // be a month, or the second part cannot be a day, infer the other order.
                    let day = first, month = second;
                    if (first <= 12 && second > 12) { month = first; day = second; }
                    else if (first <= 12 && second <= 12) {
                        // For ambiguous dates, match the browser locale used when the
                        // legacy voucher's toLocaleDateString() value was originally saved.
                        const order = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'numeric', day: 'numeric' })
                            .formatToParts(new Date(2001, 10, 22)).filter(part => ['day', 'month', 'year'].includes(part.type)).map(part => part.type);
                        if (order.indexOf('month') < order.indexOf('day')) { month = first; day = second; }
                    }
                    const check = new Date(Date.UTC(year, month - 1, day));
                    if (check.getUTCFullYear() === year && check.getUTCMonth() === month - 1 && check.getUTCDate() === day) {
                        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    }
                    return '';
                }
                const parsed = new Date(value);
                if (Number.isNaN(parsed.getTime())) return '';
                return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;

            const filteredPettyVouchers = useMemo(() => {

                return pettyVouchers.filter(v => {

                    if (!vDate || vDate < pettyDateFrom || vDate > pettyDateTo) return false;
                    if (selectedPettySessionFilter !== 'all') {
                        const voucherSessionKey = v.sessionId ? String(v.sessionId) : 'legacy';
                        if (voucherSessionKey !== String(selectedPettySessionFilter)) return false;

                    // Keep the optional time window, normalizing both 24-hour and AM/PM values.
                    const rawTime = String(v.time || '00:00').trim();
                    let vTime = rawTime.slice(0, 5);
                    const parts = rawTime.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);

            const evaluateAmountExpression = (raw) => {
                if (typeof raw !== 'string' || !raw.trim().startsWith('=')) return null;
                const source = raw.trim().slice(1).replace(/,/g, '').replace(/\s+/g, '');
                if (!source || !/^[0-9.+\-*/()%]+$/.test(source)) return null;
                let i = 0;
                const parseExpression = () => {
                    let value = parseTerm();
                    while (source[i] === '+' || source[i] === '-') {
                        const op = source[i++], rhs = parseTerm();
                        value = op === '+' ? value + rhs : value - rhs;
                    }
                    return value;
                };
                const parseTerm = () => {
                    let value = parseFactor();
                    while (source[i] === '*' || source[i] === '/') {
                        const op = source[i++], rhs = parseFactor();
                        if (op === '/' && rhs === 0) throw new Error('divide by zero');
                        value = op === '*' ? value * rhs : value / rhs;
                    }
                    return value;
                };
                const parseFactor = () => {
                    if (source[i] === '+') { i++; return parseFactor(); }
                    if (source[i] === '-') { i++; return -parseFactor(); }
                    if (source[i] === '(') {
                        i++; const value = parseExpression();
                        if (source[i++] !== ')') throw new Error('missing )');
                        return value;
                    }
                    const start = i;
                    while (/[0-9.]/.test(source[i] || '') && i < source.length) i++;
                    if (start === i) throw new Error('number expected');
                    const value = Number(source.slice(start, i));
                    if (!Number.isFinite(value)) throw new Error('invalid number');
                    return value;
                };
                try {
                    const result = parseExpression();
                    if (i !== source.length || !Number.isFinite(result)) return null;
                    return result;
                } catch (_) { return null; }
            };

                    const form = target.closest('form');

                    const getFields = () => Array.from((scope || document).querySelectorAll('input:not([type="hidden"]):not([disabled]):not([readonly]), select:not([disabled]), textarea:not([disabled])')).filter(el => el.offsetParent !== null);

                                                <option value="notes">📝 Text Notes</option>
                                            </select>
                                        </div>
                                        {newTabType === 'table' && (
                                            <>
                                                <div>
                                                    <label className="block font-bold mb-1">Column 1 Name</label>
                                                    <input type="text" placeholder="Particulars" value={newTabCol1} onChange={e => setNewTabCol1(e.target.value)} className={`w-full ${theme.cardBg} border ${theme.inputBorder} rounded-xl px-3 py-2 text-black font-bold text-center`} />
                                                </div>
                                                <div>
                                                    <label className="block font-bold mb-1">Column 2 Name</label>
                                                    <input type="text" placeholder="Amount (Rs.)" value={newTabCol2} onChange={e => setNewTabCol2(e.target.value)} className={`w-full ${theme.cardBg} border ${theme.inputBorder} rounded-xl px-3 py-2 text-black font-bold text-center`} />
                                                </div>
                                            </>
                                        )}
                                        <div className="flex gap-2">
                                            <button type="submit" className="w-full py-2.5 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl shadow">
                                                {editingCustomTabId ? '💾 Update Tab' : '+ Create Tab'}
                                            </button>
                                            {editingCustomTabId && (
                                                <button
                                                    type="button"
                                                    onClick={() => { setEditingCustomTabId(null); setNewTabTitle(''); }}
                                                    className="px-3 py-2.5 bg-slate-600 text-white font-bold rounded-xl"
                                                >
                                                    ✕
                                                </button>
                                            )}
                                        </div>
                                    </form>

                                    {customTabs.length > 0 && (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-2">
                                            {customTabs.map((ct, idx) => (
                                                <div key={ct.id} className={`p-3 rounded-xl border ${theme.cardBorder} ${theme.cardBg} flex justify-between items-center`}>
                                                    <div>
                                                        <div className="font-extrabold text-sm">{ct.icon} {ct.title}</div>
                                                        <div className="text-[10px] text-slate-400 uppercase font-bold">
                                                            {ct.type === 'table' ? `${ct.col1Label || 'Particulars'} | ${ct.col2Label || 'Amount'}` : 'Text Notes'}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-1">
                                                        <button type="button" onClick={() => handleMoveCustomTab(idx, -1)} disabled={idx === 0} className="px-1.5 py-1 bg-slate-200 text-slate-800 rounded text-[10px] font-bold disabled:opacity-40" title="Move Left">◀</button>
                                                        <button type="button" onClick={() => handleMoveCustomTab(idx, 1)} disabled={idx === customTabs.length - 1} className="px-1.5 py-1 bg-slate-200 text-slate-800 rounded text-[10px] font-bold disabled:opacity-40" title="Move Right">▶</button>
                                                        <button type="button" onClick={() => handleStartEditCustomTab(ct)} className="px-2 py-1 bg-sky-500/10 text-sky-600 hover:bg-sky-600 hover:text-white rounded-lg font-bold text-[10px] transition">
                                                            Edit
                                                        </button>
                                                        <button type="button" onClick={() => handleDeleteCustomTab(ct.id)} className="px-2 py-1 bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white rounded-lg font-bold text-[10px] transition">
                                                            Delete
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3">
                                    <h3 className="font-bold text-xs uppercase tracking-wider">{t.userPermissions}</h3>
                                    <div className={`overflow-x-auto border ${theme.cardBorder} rounded-2xl`}>
                                        <table className="w-full text-xs text-left">
                                            <thead className={`${theme.tableHeaderBg} ${theme.subText} font-bold border-b ${theme.cardBorder}`}>
                                                <tr>
                                                    <th className="p-3">USER NAME</th>
                                                    <th className="p-3">ROLE</th>
                                                    <th className="p-3 text-center">DOCTOR SHEET</th>
                                                    <th className="p-3 text-center">CASHIER SHEET</th>
                                                    <th className="p-3 text-center">PETTY CASH</th>
                                                    <th className="p-3 text-center">HISTORY LOGS</th>
                                                    {customTabs.map(ct => (
                                                        <th key={ct.id} className="p-3 text-center text-teal-600">{ct.icon} {ct.title.toUpperCase()}</th>
                                                    ))}
                                                    <th className="p-3 text-center bg-indigo-500/10 text-indigo-600">📲 INSTALL APP</th>
                                                    <th className="p-3 text-center bg-cyan-500/10 text-cyan-600">🔄 INSTANT SYNC</th>
                                                    <th className="p-3 text-center bg-emerald-500/10 text-emerald-600">📄 SHIFT READER</th>
                                                    <th className="p-3 text-center bg-slate-500/10 text-slate-600">🌐 API LINKS</th>
                                                    <th className="p-3 text-center">PRINT SETTINGS</th>
                                                    <th className="p-3 text-center">ADMIN ACCESS</th>
                                                    <th className="p-3 text-center">ACTION</th>
                                                </tr>
                                            </thead>
                                            <tbody className={`divide-y ${theme.cardBorder}`}>
                                                {users.map(u => (
                                                    <tr key={u.id}>
                                                        <td className="p-3 font-bold">{u.name}</td>
                                                        <td className="p-3"><span className="px-2 py-0.5 bg-slate-200 text-slate-800 rounded font-bold">{u.role}</span></td>
                                                        <td className="p-3 text-center"><input type="checkbox" checked={u.permissions?.docReconciliation} onChange={() => togglePermission(u.id, 'docReconciliation')} /></td>
                                                        <td className="p-3 text-center"><input type="checkbox" checked={u.permissions?.cashierSheet} onChange={() => togglePermission(u.id, 'cashierSheet')} /></td>
                                                        <td className="p-3 text-center"><input type="checkbox" checked={u.permissions?.pettyCash} onChange={() => togglePermission(u.id, 'pettyCash')} /></td>
                                                        <td className="p-3 text-center"><input type="checkbox" checked={!!u.permissions?.history} onChange={() => togglePermission(u.id, 'history')} /></td>
                                                        {customTabs.map(ct => (
                                                            <td key={ct.id} className="p-3 text-center">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={!!u.permissions?.[ct.id]}
                                                                    onChange={() => togglePermission(u.id, ct.id)}
                                                                />
                                                            </td>
                                                        ))}
                                                        <td className="p-3 text-center bg-indigo-500/5"><input type="checkbox" checked={!!u.permissions?.installAppBtn} onChange={() => togglePermission(u.id, 'installAppBtn')} /></td>
                                                        <td className="p-3 text-center bg-cyan-500/5"><input type="checkbox" checked={!!u.permissions?.instantSyncBtn} onChange={() => togglePermission(u.id, 'instantSyncBtn')} /></td>
                                                        <td className="p-3 text-center bg-emerald-500/5"><input type="checkbox" checked={!!u.permissions?.shiftReaderBtn} onChange={() => togglePermission(u.id, 'shiftReaderBtn')} /></td>
                                                        <td className="p-3 text-center bg-slate-500/5"><input type="checkbox" checked={!!u.permissions?.apiLinksBtn} onChange={() => togglePermission(u.id, 'apiLinksBtn')} /></td>
                                                        <td className="p-3 text-center"><input type="checkbox" checked={!!u.permissions?.printSettings} onChange={() => togglePermission(u.id, 'printSettings')} /></td>
                                                        <td className="p-3 text-center"><input type="checkbox" checked={!!u.permissions?.admin} onChange={() => togglePermission(u.id, 'admin')} /></td>
                                                        <td className="p-3 text-center space-x-1">
                                                            <button onClick={() => handleOpenEditUser(u)} className="text-sky-600 font-bold px-2 py-1 rounded bg-sky-50 hover:bg-sky-100 border border-sky-200 text-[10px]">✏️ Edit</button>
                                                            {u.id !== 'USR001' && (
                                                                <button onClick={() => handleDeleteUser(u.id)} className="text-rose-500 font-bold px-2 py-1 rounded bg-rose-50 hover:bg-rose-100 border border-rose-200 text-[10px]">Delete</button>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {customTabs.map(ctab => activeTab === ctab.id && (
                            <div key={ctab.id} className={`${theme.cardBg} border ${theme.cardBorder} rounded-2xl p-6 shadow-2xl space-y-6 transition-colors duration-300`}>
                                <div className={`flex justify-between items-center border-b ${theme.cardBorder} pb-4`}>
                                    <div>
                                        <h2 className={`text-xl font-extrabold ${theme.text} tracking-wide uppercase`}>{ctab.icon} {ctab.title}</h2>
                                        <p className={`text-xs ${theme.subText} mt-1`}>Custom Workspace • Synced Live with Cloud</p>
                                    </div>
                                    <div className="flex space-x-2">
                                        {ctab.type === 'notes' && (
                                            <button
                                                onClick={() => {
                                                    syncToCloud({ customTabContent });
                                                    showToast('Notes saved & synced to cloud!');
                                                }}
                                                className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-xl font-bold shadow"
                                            >
                                                💾 Save & Sync Notes
                                            </button>
                                        )}
                                        <button onClick={() => handlePrintCustomTab(ctab)} className="px-3.5 py-1.5 bg-teal-600 hover:bg-teal-500 text-white text-xs rounded-xl font-bold shadow">
                                            🖨️ Print Sheet
                                        </button>
                                    </div>
                                </div>

                                {ctab.type === 'table' ? (() => {
                                    const tabData = customTabContent[ctab.id] || { rows: [], newDesc: '', newAmount: '' };
                                    const rows = tabData.rows || [];
                                    const total = rows.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
                                    const col1 = ctab.col1Label || 'Particulars / Description';
                                    const col2 = ctab.col2Label || 'Amount (Rs.)';
                                    return (
                                        <div className="space-y-6">
                                            <div className={`p-4 rounded-2xl border ${theme.cardBorder} ${theme.inputBg} grid grid-cols-1 md:grid-cols-4 gap-3 items-end text-xs`}>
                                                <div className="md:col-span-2">
                                                    <label className="block font-bold mb-1">{col1}</label>
                                                    <input
                                                        type="text"
                                                        placeholder={`Enter ${col1}...`}
                                                        value={tabData.newDesc || ''}
                                                        onChange={e => setCustomTabContent(prev => ({
                                                            ...prev,
                                                            [ctab.id]: { ...tabData, newDesc: e.target.value }
                                                        }))}
                                                        className={`w-full ${theme.cardBg} border ${theme.inputBorder} rounded-xl px-3 py-2 text-black font-bold text-center`}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block font-bold mb-1">{col2}</label>
                                                    <input
                                                        type="text" inputMode="decimal" onKeyDown={handleKeyDownNavigation}
                                                        step="0.01"
                                                        placeholder="0.00"
                                                        value={tabData.newAmount || ''}
                                                        onBlur={e => { const v = evaluateAmountExpression(e.target.value); if (v !== null) setCustomTabContent(prev => ({ ...prev, [ctab.id]: { ...(prev[ctab.id] || {}), newAmount: v.toFixed(2) } })); }}
                                                        onChange={e => setCustomTabContent(prev => ({
                                                            ...prev,
                                                            [ctab.id]: { ...tabData, newAmount: e.target.value }
                                                        }))}
                                                        className={`w-full ${theme.cardBg} border ${theme.inputBorder} rounded-xl px-3 py-2 font-mono text-black font-bold text-center`}
                                                    />
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={() => handleAddCustomTabRow(ctab.id)}
                                                    className="w-full py-2.5 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl shadow"
                                                >
                                                    + Add Entry
                                                </button>
                                            </div>

                                            <div className={`overflow-x-auto border ${theme.cardBorder} rounded-2xl`}>
                                                <table className="w-full text-xs text-left">
                                                    <thead className={`${theme.tableHeaderBg} ${theme.subText} font-bold border-b ${theme.cardBorder}`}>
                                                        <tr>
                                                            <th className="p-3">DATE & SHIFT</th>
                                                            <th className="p-3 uppercase">{col1}</th>
                                                            <th className="p-3">CASHIER</th>
                                                            <th className="p-3 text-right uppercase">{col2}</th>
                                                            <th className="p-3 text-center">ACTION</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className={`divide-y ${theme.cardBorder}`}>
                                                        {rows.length === 0 ? (
                                                            <tr><td colSpan={5} className={`p-6 text-center ${theme.subText}`}>No entries added yet.</td></tr>
                                                        ) : (
                                                            rows.map(r => (
                                                                <tr key={r.id}>
                                                                    <td className="p-3 font-mono">{r.date} ({r.shift})</td>
                                                                    <td className="p-3 font-bold">{r.desc}</td>
                                                                    <td className="p-3">{r.cashier}</td>
                                                                    <td className="p-3 text-right font-mono font-bold text-teal-600">Rs. {Number(r.amount).toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>
                                                                    <td className="p-3 text-center">
                                                                        <button onClick={() => handleDeleteCustomTabRow(ctab.id, r.id)} className="px-2 py-1 bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white rounded text-[10px] font-bold">
                                                                            Delete
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            ))
                                                        )}
                                                        <tr className="bg-teal-600 text-white font-black">
                                                            <td colSpan={3} className="p-3 text-right uppercase">Total Amount:</td>
                                                            <td className="p-3 text-right font-mono text-sm">Rs. {total.toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>
                                                            <td></td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    );
                                })() : (
                                    <div className="space-y-3">
                                        <textarea
                                            rows={10}
                                            placeholder="Type your daily records, shift handover notes, or custom logs here..."
                                            value={(customTabContent[ctab.id] && customTabContent[ctab.id].notes) || ''}
                                            onChange={e => handleUpdateCustomTabNotes(ctab.id, e.target.value)}
                                            style={{ textAlign: 'left' }}
                                            className={`w-full ${theme.inputBg} border ${theme.inputBorder} rounded-2xl p-4 text-sm font-semibold text-black`}
                                        />
                                    </div>
                                )}
                            </div>
                        ))}
                    </main>

                    <footer className={`${theme.cardBg} border-t ${theme.cardBorder} py-3 text-center text-xs ${theme.subText} mt-auto no-print`}>
                        Doctor Payment Reconciliation System • Developed for Clinical Operations
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
